<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título da Ferramenta -->
    <title>Luna AI - Assistente Inteligente</title>

    <!-- Fontes (Mantendo 'Inter' do seu padrão) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Recursos externos necessários para a interface do Chatbot -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =================================================================== */
        /* == ESTILOS GERAIS DO APLICATIVO (BASE DO SEU TEMPLATE) == */
        /* =================================================================== */
        :root {
            /* Paleta de cores do seu programa Electron */
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d2d;
            --border-color: #3c3c3c;
            --text-primary: #d4d4d4;
            --text-secondary: #cccccc;
            --text-muted: #858585;
            --accent-color: #7b68ee; /* Roxo como cor de destaque */
            --hover-bg: #3a3d41;

            /* Cores de estado para o chatbot */
            --accent-green: #28a745;
            --accent-red: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--bg-secondary);
        }

        .back-button {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .back-button:hover {
            background-color: var(--hover-bg);
        }

        .back-button svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }

        .page-title {
            font-size: 1.5em;
            font-weight: 500;
            margin: 0 0 0 15px;
        }

        .page-content {
            flex-grow: 1;
            overflow: hidden; /* O conteúdo interno terá sua própria rolagem */
            display: flex;
            flex-direction: column;
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* =================================================================== */
        /* == ESTILOS DO CHATBOT (ADAPTADOS PARA O PADRÃO DE CORES) == */
        /* =================================================================== */

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #connection-status {
            font-size: 0.8rem;
            font-weight: 300;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            transition: all 0.3s ease;
        }
        .connected { background: var(--accent-green); box-shadow: 0 0 10px 1px var(--accent-green); }
        .disconnected { background: var(--accent-red); box-shadow: 0 0 10px 1px var(--accent-red); }

        #chat-window {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        
        .message-bubble {
            max-width: 75%;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            animation: bubble-appear 0.4s ease-out forwards;
            opacity: 0;
            user-select: text; /* Permite selecionar texto das mensagens */
        }
        
        .user-message {
            background: var(--accent-color);
            color: var(--text-primary);
            border-bottom-right-radius: 0.25rem;
            align-self: flex-end;
            font-weight: 500;
        }
        
        .luna-message {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 0.25rem;
            align-self: flex-start;
        }
        
        @keyframes bubble-appear {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing-indicator .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); margin: 0 2px; animation: bounce 1.3s infinite ease-in-out; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

        .chat-input-area {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        
        #message-form .input-group {
            background-color: var(--bg-tertiary);
            border-radius: 2rem;
            padding: 0.25rem;
            border: 1px solid var(--border-color);
        }
        #message-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            resize: none;
            height: 50px;
            user-select: text;
        }
        #message-input::placeholder { color: var(--text-muted); }
        #message-input:focus { box-shadow: none; }

        .icon-btn, .send-btn {
            background-color: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.2s ease, transform 0.2s ease;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { color: var(--accent-color); transform: scale(1.1); }
        .send-btn { background-color: var(--accent-color); color: var(--text-primary); }
        .send-btn:hover { filter: brightness(1.2); transform: scale(1.05); }
        .send-btn:disabled { background-color: var(--bg-tertiary); color: var(--text-muted); transform: scale(1); filter: none; }
        
        .offcanvas { background-color: var(--bg-secondary); color: var(--text-primary); border-left: 1px solid var(--border-color); }
        .offcanvas-header { border-bottom: 1px solid var(--border-color); }
        .btn-close { filter: invert(1); }
        .form-label { color: var(--text-muted); font-weight: 500; margin-bottom: 0.5rem; }
        .form-control, .form-select { background-color: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .form-control:focus, .form-select:focus { background-color: var(--bg-tertiary); color: var(--text-primary); border-color: var(--accent-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 25%, transparent); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hover-bg); }

    </style>
</head>
<body>
    <!-- Painel de Configurações (Offcanvas do Bootstrap) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="settings-offcanvas" aria-labelledby="settingsOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="settingsOffcanvasLabel"><i class="fas fa-sliders-h me-2"></i>Configurações</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar configurações"></button>
        </div>
        <div class="offcanvas-body">
            <div class="mb-4">
                <label for="model-select" class="form-label">Modelo AI</label>
                <select id="model-select" class="form-select" aria-label="Seleção de modelo de IA">
                    <option>Carregando...</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="context-input" class="form-label">Contexto da Conversa</label>
                <div class="input-group">
                    <input type="text" id="context-input" class="form-control" placeholder="Definir contexto global">
                    <button id="set-context-btn" class="btn" style="background-color: var(--accent-color); color: var(--text-primary);" type="button" aria-label="Salvar contexto"><i class="fas fa-check"></i></button>
                </div>
            </div>
            <div class="alert mt-4" style="background-color: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-secondary);" role="alert">
                <i class="fas fa-info-circle me-2"></i>Contexto atual: <strong id="current-context">Nenhum</strong>
            </div>
            <hr style="color: var(--border-color);">
            <button id="clear-history-btn" class="btn w-100" style="background-color: var(--accent-red); color: white;"><i class="fas fa-trash-alt me-2"></i>Limpar Histórico do Chat</button>
        </div>
    </div>

    <!-- Estrutura Principal da Página -->
    <div class="page-container">
        <header class="page-header">
            <!-- Botão de Voltar -->
            <button class="back-button" onclick="window.location.href='../tools.html'" title="Voltar ao Menu">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <!-- Título da Ferramenta -->
            <h1 class="page-title">
                <i class="fas fa-moon me-2" style="color: var(--accent-color);"></i>Luna AI
            </h1>

            <!-- Elementos de Controle do Chatbot -->
            <div class="ms-auto d-flex align-items-center">
                <div id="connection-status" class="d-flex align-items-center me-3">
                    <span class="status-indicator disconnected"></span><small>Conectando...</small>
                </div>
                <button class="icon-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#settings-offcanvas" aria-controls="settings-offcanvas" aria-label="Abrir configurações">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <main class="page-content">
            <!-- Wrapper da Aplicação Chatbot -->
            <div class="app-wrapper">
                <div id="chat-window">
                    <div id="chat-messages" class="d-flex flex-column"></div>
                </div>

                <footer class="chat-input-area">
                    <form id="message-form">
                        <label for="message-input" class="visually-hidden">Mensagem</label>
                        <div class="input-group align-items-center">
                            <button id="voice-input-btn" type="button" class="icon-btn" aria-label="Entrada por voz">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <textarea id="message-input" class="form-control" placeholder="Digite sua mensagem..." rows="1"></textarea>
                            <button type="submit" id="send-button" class="send-btn" aria-label="Enviar mensagem">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <!-- Scripts necessários para a funcionalidade -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'https://api.syradevops.com';
        let currentModel = '';
        let currentContext = null;
        
        const dom = {
            modelSelect: document.getElementById('model-select'),
            contextInput: document.getElementById('context-input'),
            setContextBtn: document.getElementById('set-context-btn'),
            currentContextEl: document.getElementById('current-context'),
            chatWindow: document.getElementById('chat-window'),
            chatMessages: document.getElementById('chat-messages'),
            messageForm: document.getElementById('message-form'),
            messageInput: document.getElementById('message-input'),
            sendButton: document.getElementById('send-button'),
            statusIndicator: document.querySelector('.status-indicator'),
            connectionStatus: document.getElementById('connection-status'),
            clearHistoryBtn: document.getElementById('clear-history-btn'),
            voiceInputBtn: document.getElementById('voice-input-btn'),
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        const isScrolledToBottom = () => dom.chatWindow.scrollHeight - dom.chatWindow.clientHeight <= dom.chatWindow.scrollTop + 100;
        
        function scrollToBottom(force = false) {
            if (force || isScrolledToBottom()) {
                dom.chatWindow.scrollTo({ top: dom.chatWindow.scrollHeight, behavior: 'smooth' });
            }
        }

        function saveHistory() {
            const messages = [...dom.chatMessages.children]
                .filter(el => !el.id.includes('typing-indicator'))
                .map(msg => ({
                    text: msg.textContent,
                    sender: msg.classList.contains('user-message') ? 'user' : 'luna'
                }));
            localStorage.setItem('chatHistory_LunaAI', JSON.stringify(messages));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('chatHistory_LunaAI') || '[]');
            if (history.length === 0) {
                 addMessage('Olá! Sou a Luna, sua assistente de IA. Como posso ajudar você hoje?', 'luna', false);
            } else {
                history.forEach(({ text, sender }) => addMessage(text, sender, false));
            }
            setTimeout(() => scrollToBottom(true), 100);
        }

        function addMessage(text, sender, save = true) {
            const messageEl = document.createElement('div');
            messageEl.className = `message-bubble ${sender}-message`;
            messageEl.textContent = text;
            dom.chatMessages.appendChild(messageEl);
            scrollToBottom();
            if (save) saveHistory();
        }

        function showTypingIndicator() {
            hideTypingIndicator();
            const typingEl = document.createElement('div');
            typingEl.id = 'typing-indicator';
            typingEl.className = 'message-bubble luna-message';
            typingEl.innerHTML = `<div class="typing-indicator"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
            dom.chatMessages.appendChild(typingEl);
            scrollToBottom(true);
        }

        function hideTypingIndicator() {
            document.getElementById('typing-indicator')?.remove();
        }

        async function sendMessage(message) {
            message = message.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            dom.messageInput.value = '';
            dom.messageInput.style.height = '50px';
            dom.messageInput.disabled = true;
            dom.sendButton.disabled = true;
            dom.sendButton.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>`;
            showTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message, model_name: currentModel, context: currentContext }),
                });

                hideTypingIndicator();
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Resposta inválida da API' }));
                    throw new Error(errorData.detail || 'Falha na resposta da API');
                }
                
                const data = await response.json();
                addMessage(data.response, 'luna');
                
            } catch (error) {
                hideTypingIndicator();
                addMessage(`Desculpe, ocorreu um erro: ${error.message}`, 'luna');
            } finally {
                dom.messageInput.disabled = false;
                dom.sendButton.disabled = false;
                dom.sendButton.innerHTML = `<i class="fas fa-paper-plane"></i>`;
                dom.messageInput.focus();
            }
        }
        
        async function fetchModels() {
            const response = await fetch(`${API_BASE}/models`);
            if (!response.ok) throw new Error('Falha ao carregar modelos');
            return await response.json();
        }

        function populateModelSelect(models) {
            dom.modelSelect.innerHTML = models.map(model => `<option value="${model}">${model.charAt(0).toUpperCase() + model.slice(1)}</option>`).join('');
            currentModel = models[0];
            dom.modelSelect.value = currentModel;
        }
        
        async function getContext() {
            try {
                const response = await fetch(`${API_BASE}/context`);
                if (!response.ok) throw new Error('Falha ao obter contexto');
                const data = await response.json();
                currentContext = data.context;
                dom.currentContextEl.textContent = currentContext || 'Nenhum';
            } catch (error) { dom.currentContextEl.textContent = 'Erro ao carregar'; }
        }

        async function setContext() {
            const newContext = dom.contextInput.value.trim() || null;
            currentContext = newContext; // Atualiza localmente imediatamente
            dom.currentContextEl.textContent = currentContext || 'Nenhum';
            
            // Você pode querer salvar isso na API também
            // try {
            //     await fetch(`${API_BASE}/context`, {
            //         method: 'POST',
            //         headers: {'Content-Type': 'application/json'},
            //         body: JSON.stringify({ context: newContext }),
            //     });
            // } catch (error) { alert(`Erro ao salvar contexto na API: ${error.message}`); }
            
            dom.contextInput.value = '';
            const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('settings-offcanvas'));
            if(offcanvas) offcanvas.hide();
        }
        
        function setupEventListeners() {
            dom.messageForm.addEventListener('submit', e => { e.preventDefault(); sendMessage(dom.messageInput.value); });
            dom.messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(dom.messageInput.value); } });
            dom.messageInput.addEventListener('input', () => {
                dom.messageInput.style.height = 'auto';
                const newHeight = Math.min(dom.messageInput.scrollHeight, 150); // Limita a altura máxima
                dom.messageInput.style.height = `${newHeight}px`;
            });
            dom.setContextBtn.addEventListener('click', setContext);
            dom.modelSelect.addEventListener('change', () => { currentModel = dom.modelSelect.value; });
            dom.clearHistoryBtn.addEventListener('click', () => {
                if (confirm('Tem certeza que deseja apagar todo o histórico da conversa?')) {
                    localStorage.removeItem('chatHistory_LunaAI');
                    dom.chatMessages.innerHTML = '';
                    addMessage('Histórico limpo. Como posso ajudar?', 'luna', false);
                }
            });

            if(SpeechRecognition){
                recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.interimResults = false;
                
                recognition.onstart = () => {
                    dom.voiceInputBtn.style.color = 'var(--accent-red)';
                };
                
                recognition.onend = () => {
                    dom.voiceInputBtn.style.color = ''; // Reset color
                };

                recognition.onresult = event => {
                    dom.messageInput.value = event.results[0][0].transcript;
                };

                recognition.onerror = event => {
                    console.error(`Erro no reconhecimento de voz: ${event.error}`);
                }
                
                dom.voiceInputBtn.addEventListener('click', () => {
                    recognition.start();
                });

            } else {
                dom.voiceInputBtn.disabled = true;
                dom.voiceInputBtn.style.display = 'none';
            }
        }
        
        async function init() {
            setupEventListeners();
            loadHistory();
            try {
                const healthCheck = await fetch(`${API_BASE}/health`);
                if (!healthCheck.ok) throw new Error('API offline');
                
                dom.connectionStatus.innerHTML = `<span class="status-indicator connected"></span><small>Online</small>`;
                populateModelSelect(await fetchModels());
                // await getContext(); // Comentado pois o contexto agora é local/volátil por padrão
            } catch (error) {
                dom.connectionStatus.innerHTML = `<span class="status-indicator disconnected"></span><small>${error.message}</small>`;
                dom.modelSelect.innerHTML = `<option>Indisponível</option>`;
                addMessage(`Falha na conexão com a API. Algumas funcionalidades podem não estar disponíveis.`, 'luna', false);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
