<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SyraScience</title>

  <!-- Fonte Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-tertiary: #2d2d2d;
      --border-color: #3c3c3c;
      --text-primary: #d4d4d4;
      --text-secondary: #cccccc;
      --accent-color: #7b68ee;
      --hover-bg: #3a3d41;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .splash {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeOut 1s ease 2.5s forwards;
    }

    .splash h1 {
      font-size: 3em;
      color: var(--accent-color);
      animation: pulse 2s infinite;
      letter-spacing: 2px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .page-container {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .page-header {
      padding: 15px 25px;
      border-bottom: 1px solid var(--border-color);
      font-size: 1.5em;
      font-weight: 600;
    }

    .page-content {
      display: flex;
      flex-grow: 1;
      padding: 20px;
      gap: 30px;
    }

    .input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-area input {
      padding: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 1em;
    }

    .input-area button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #6a5acd;
    }

    #graph {
      flex: 2;
      border: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div class="splash">
    <h1>SyraScience</h1>
  </div>

  <!-- Ferramenta -->
  <div class="page-container">
    <header class="page-header">Visualizador de Equações 2D</header>
    <main class="page-content">
      <div class="input-area">
        <label for="equation">Digite uma equação (ex: sin(x), x^2, etc):</label>
        <input id="equation" type="text" placeholder="ex: cos(x)" />
        <button onclick="plotEquation()">Plotar Gráfico</button>
      </div>
      <div id="graph"></div>
    </main>
  </div>

  <script>
    // Esconde splash e mostra app
    setTimeout(() => {
      document.querySelector('.splash').style.display = 'none';
      document.querySelector('.page-container').style.display = 'flex';
    }, 3000);

    // Função para plotar equação
    function plotEquation() {
      const eqInput = document.getElementById('equation').value;
      const x = [];
      const y = [];

      for (let i = -10; i <= 10; i += 0.1) {
        x.push(i);
        try {
          const val = eval(eqInput.replace(/x/g, i));
          y.push(val);
        } catch {
          y.push(null);
        }
      }

      Plotly.newPlot('graph', [{
        x, y,
        type: 'scatter',
        mode: 'lines',
        line: { color: '#7b68ee' }
      }], {
        margin: { t: 20 },
        paper_bgcolor: '#2d2d2d',
        plot_bgcolor: '#2d2d2d',
        font: { color: '#d4d4d4' }
      });
    }
  </script>

</body>
</html>
