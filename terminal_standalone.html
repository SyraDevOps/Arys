<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Terminal Syra</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      height: 100%;
      overflow: hidden;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 5px;
      box-sizing: border-box;
    }
  </style>
  <link rel="stylesheet" href="./node_modules/xterm/css/xterm.css" />
</head>
<body>
  <div id="terminal"></div>

  <script>
    const { Terminal } = require('xterm');
    const { FitAddon } = require('xterm-addon-fit');
    const { ipcRenderer } = require('electron');

    const term = new Terminal({
      cursorBlink: true,
      theme: {
        background: '#1e1e1e',
        foreground: '#ffffff',
        cursor: '#a29bfe',
        selectionBackground: 'rgba(162, 155, 254, 0.3)'
      },
      fontFamily: '"Fira Code", monospace',
      fontSize: 14,
      allowProposedApi: true
    });

    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    const params = new URLSearchParams(window.location.search);
    const cwd = decodeURIComponent(params.get('cwd') || '');

    ipcRenderer.send('terminal-init', { cwd });

    term.onData(data => {
      ipcRenderer.send('terminal-keystroke', data);
    });

    ipcRenderer.on('terminal-incoming-data', (event, data) => {
      term.write(data);
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      ipcRenderer.send('terminal-resize', {
        cols: term.cols,
        rows: term.rows
      });
    });

    // Send initial size
    setTimeout(() => {
        ipcRenderer.send('terminal-resize', {
            cols: term.cols,
            rows: term.rows
        });
    }, 500);
  </script>
</body>
</html>
