<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Arys Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #252526;
            --border-color: #333333;
            --text-primary: #e1e1e1;
            --text-secondary: #cccccc;
            --text-muted: #858585;
            --accent-color: #a29bfe;
            --hover-bg: #2d2d30;
            --active-bg: #37373d;
            --close-hover-bg: #e81123;
            --close-hover-text: white;
            --selection-bg: rgba(162, 155, 254, 0.2);
            --delete-color: #ff7675;
        }

        body.theme-white {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f3f3;
            --bg-tertiary: #e8e8e8;
            --border-color: #d1d1d1;
            --text-primary: #1f1f1f;
            --text-secondary: #333333;
            --text-muted: #6e6e6e;
            --accent-color: #6c5ce7;
            --hover-bg: #e0e0e0;
            --active-bg: #d9d9d9;
            --selection-bg: rgba(108, 92, 231, 0.2);
        }

        body.theme-red {
            --bg-primary: #1a0a0a;
            --bg-secondary: #2d1414;
            --bg-tertiary: #3a1a1a;
            --border-color: #4a2525;
            --text-primary: #f8d7da;
            --text-secondary: #e2b3b7;
            --text-muted: #a5676b;
            --accent-color: #ff7675;
            --hover-bg: #4a2525;
            --active-bg: #5a2a2a;
            --selection-bg: rgba(255, 118, 117, 0.2);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-primary);
            color: var(--text-primary); overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 35px; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag; z-index: 1000; }
        .app-layout { display: flex; height: 100vh; padding-top: 35px; }
        .side-menu { width: 50px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); z-index: 999; display: flex; flex-direction: column; align-items: center; padding-top: 15px; flex-shrink: 0; gap: 10px; }
        .main-container { display: flex; flex-grow: 1; height: 100%; position: relative; overflow: hidden; }
        .file-explorer { width: 250px; min-width: 180px; max-width: 500px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: none; flex-direction: column; flex-shrink: 0; position: relative; }
        .file-explorer.visible { display: flex; }
        .resizer { width: 4px; cursor: col-resize; z-index: 50; flex-shrink: 0; transition: background-color 0.3s; }
        .resizer:hover, .resizer.resizing { background: var(--accent-color); }
        .editor-section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }

        .window-info { display: flex; align-items: center; gap: 10px; margin-left: 15px; font-size: 13px; font-weight: 500; -webkit-app-region: no-drag; }
        #current-folder, #current-title { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
        #modified-indicator { font-weight: bold; color: var(--accent-color); margin-left: 4px; display: inline-block; width: 10px; }
        .window-controls { display: flex; height: 100%; -webkit-app-region: no-drag; }
        .control-button { width: 45px; height: 100%; border: none; background: transparent; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .control-button:hover { background: var(--hover-bg); }
        #close-btn:hover { background: var(--close-hover-bg); color: var(--close-hover-text); }
        .icon { width: 20px; height: 20px; stroke-width: 1.5; stroke: currentColor; fill: none; transition: transform 0.2s; }

        .side-menu-item { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text-muted); border-radius: 8px; transition: all 0.2s; }
        .side-menu-item:hover { color: var(--text-primary); background: var(--hover-bg); }
        .side-menu-item.active { color: var(--accent-color); background: var(--active-bg); }

        .submenu-container { position: fixed; left: 55px; background: rgba(30, 30, 30, 0.8); border: 1px solid var(--border-color); display: none; z-index: 1001; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 6px 0; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        #file-submenu { top: 70px; }
        #theme-submenu { top: 220px; }
        .show-submenu { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .submenu-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; width: 220px; transition: background 0.2s; }
        .submenu-item:hover { background: var(--hover-bg); color: var(--accent-color); }
        .submenu-item .icon { width: 18px; height: 18px; }
        .submenu-text { font-size: 13px; flex-grow: 1; }

        .file-explorer-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 5px; border-bottom: 1px solid var(--border-color); }
        .file-explorer-title { flex-grow: 1; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .nav-button { padding: 6px; background: none; border: none; color: var(--text-muted); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-button:hover { background: var(--hover-bg); color: var(--text-primary); }
        .path-navigation { padding: 8px 12px; background: var(--bg-tertiary); font-size: 11px; display: flex; align-items: center; gap: 8px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        .file-tree { padding: 8px; overflow-y: auto; flex-grow: 1; user-select: none; }
        .file-item, .folder-header { padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 6px; margin-bottom: 2px; transition: background 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item:hover, .folder-header:hover { background: var(--hover-bg); }
        .file-item.selected, .folder-header.selected { background-color: var(--active-bg); color: var(--accent-color); }
        .folder .folder-arrow { transition: transform 0.2s; display: flex; align-items: center; justify-content: center; width: 12px; }
        .folder.expanded > .folder-header .folder-arrow { transform: rotate(90deg); }
        .folder-content { display: none; padding-left: 18px; }
        .folder.expanded > .folder-content { display: block; }

        .editor-container { display: flex; background: var(--bg-primary); height: 100%; width: 100%; position: relative; overflow: hidden; }
        #monaco-container { flex: 1; height: 100%; min-width: 0; }

        #preview-container {
            flex: 1;
            height: 100%;
            background: white;
            display: none;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        #preview-container.visible { display: flex; }
        #preview-frame { flex: 1; border: none; background: white; }
        #preview-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: white;
            color: #333;
            user-select: text;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
        #preview-content h1, #preview-content h2, #preview-content h3 { color: #111; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 24px; }
        #preview-content code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 0.9em; }
        #preview-content pre { background: #f8f8f8; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #eee; }
    </style>
</head>
<body class="theme-dark">
    <div class="top-bar">
        <div class="window-info">
            <span class="window-title">Arys</span>
            <span style="opacity: 0.3;">|</span>
            <span id="current-folder">Sem pasta</span>
            <span style="opacity: 0.3;">/</span>
            <span id="current-title">Sem título</span>
            <span id="modified-indicator"></span>
        </div>
        <div class="window-controls">
            <button class="control-button" id="minimize-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            <button class="control-button" id="maximize-btn"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg></button>
            <button class="control-button" id="close-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
    </div>

    <div class="app-layout">
        <div class="side-menu">
            <div class="side-menu-item" id="show-explorer" title="Explorador"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="side-menu-item" id="file-menu" title="Arquivo"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg></div>
            <div class="side-menu-item" id="terminal-toggle" title="Terminal"><svg class="icon" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg></div>
            <div class="side-menu-item" id="tools-menu" title="Ferramentas"><svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div>
            <div class="side-menu-item" id="preview-toggle" title="Alternar Preview"><svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <div style="flex-grow: 1;"></div>
            <div class="side-menu-item" id="theme-menu" title="Temas"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></div>
        </div>

        <div class="submenu-container" id="file-submenu">
             <div class="submenu-item" data-action="new-file"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><span class="submenu-text">Novo Arquivo</span></div>
             <div class="submenu-item" data-action="open-file"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg><span class="submenu-text">Abrir Arquivo</span></div>
             <div class="submenu-item" data-action="open-folder"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span class="submenu-text">Abrir Pasta</span></div>
             <div class="submenu-item" data-action="save-file"><svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg><span class="submenu-text">Salvar</span></div>
        </div>

        <div class="submenu-container" id="theme-submenu">
            <div class="submenu-item" data-theme="dark"><span class="submenu-text">Escuro</span></div>
            <div class="submenu-item" data-theme="white"><span class="submenu-text">Claro</span></div>
            <div class="submenu-item" data-theme="red"><span class="submenu-text">Vermelho</span></div>
        </div>

        <div class="main-container">
            <div class="file-explorer">
                <div class="file-explorer-header">
                    <div class="file-explorer-title">Explorador</div>
                    <button class="nav-button" id="new-file-explorer" title="Novo Arquivo"><svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></button>
                    <button class="nav-button" id="new-folder-explorer" title="Nova Pasta"><svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></button>
                </div>
                <div class="path-navigation">
                    <span id="current-path">Nenhuma pasta aberta</span>
                </div>
                <div class="file-tree" tabindex="-1"></div>
            </div>

            <div class="resizer" id="explorer-resizer"></div>

            <div class="editor-section">
                <div class="editor-container">
                    <iframe id="welcome-frame" src="welcome.html" style="display: none; width: 100%; height: 100%; border: none; z-index: 10;"></iframe>
                    <div id="monaco-container"></div>
                    <div id="preview-container">
                        <div id="preview-content"></div>
                        <iframe id="preview-frame" style="display: none;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" style="display: none;">

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const { marked } = require('marked');

        // --- MONACO LOADER ---
        const amdLoader = require('./node_modules/monaco-editor/min/vs/loader.js');
        const amdRequire = amdLoader.require;
        amdLoader.config({ baseUrl: uriFromPath(path.join(__dirname, './node_modules/monaco-editor/min')) });

        function uriFromPath(_path) {
            var pathName = path.resolve(_path).replace(/\\/g, '/');
            if (pathName.length > 0 && pathName[0] !== '/') pathName = '/' + pathName;
            return encodeURI('file://' + pathName);
        }

        self.module = undefined;
        let editor;

        const dom = {
            body: document.body,
            monacoContainer: document.getElementById('monaco-container'),
            previewContainer: document.getElementById('preview-container'),
            previewContent: document.getElementById('preview-content'),
            previewFrame: document.getElementById('preview-frame'),
            fileExplorer: document.querySelector('.file-explorer'),
            fileTree: document.querySelector('.file-tree'),
            resizer: document.getElementById('explorer-resizer'),
            welcomeFrame: document.getElementById('welcome-frame'),
            fileInput: document.getElementById('file-input'),
            currentFolderTitle: document.getElementById('current-folder'),
            currentFileTitle: document.getElementById('current-title'),
            modifiedIndicator: document.getElementById('modified-indicator'),
            currentPathDisplay: document.getElementById('current-path'),
            fileSubmenu: document.getElementById('file-submenu'),
            themeSubmenu: document.getElementById('theme-submenu'),
        };

        let state = {
            currentFilePath: null,
            isModified: false,
            currentDirPath: null,
            isPreviewVisible: false
        };

        const FOLDER_ICON = `<svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
        const FILE_ICON = `<svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`;
        const ARROW_ICON = `<svg class="icon" style="width:12px; height:12px;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>`;

        function updateTitleBar() {
            dom.currentFileTitle.textContent = state.currentFilePath ? path.basename(state.currentFilePath) : 'Sem Título';
            dom.modifiedIndicator.textContent = state.isModified ? '●' : '';
        }

        function toggleWelcomePage(show) {
            dom.welcomeFrame.style.display = show ? 'block' : 'none';
            dom.monacoContainer.style.display = show ? 'none' : 'block';
            if (!show && editor) { editor.layout(); editor.focus(); }
        }

        function updatePreview() {
            if (!state.isPreviewVisible) return;
            const content = editor.getValue();
            const ext = state.currentFilePath ? path.extname(state.currentFilePath).toLowerCase() : '';
            if (ext === '.md') {
                dom.previewContent.style.display = 'block';
                dom.previewFrame.style.display = 'none';
                dom.previewContent.innerHTML = marked.parse(content);
            } else if (ext === '.html' || ext === '.htm') {
                dom.previewContent.style.display = 'none';
                dom.previewFrame.style.display = 'block';
                dom.previewFrame.srcdoc = content;
            } else {
                dom.previewContent.style.display = 'block';
                dom.previewFrame.style.display = 'none';
                dom.previewContent.innerHTML = '<div style="color:#888; text-align:center; padding:50px;">Preview não disponível</div>';
            }
        }

        async function openFile(filePath) {
            try {
                const content = await fs.promises.readFile(filePath, 'utf-8');
                editor.setValue(content);
                const ext = path.extname(filePath).toLowerCase().substring(1);
                const langMap = { 'js': 'javascript', 'ts': 'typescript', 'py': 'python', 'md': 'markdown', 'html': 'html', 'css': 'css', 'json': 'json' };
                monaco.editor.setModelLanguage(editor.getModel(), langMap[ext] || 'plaintext');
                state.currentFilePath = filePath;
                state.isModified = false;
                dom.currentFolderTitle.textContent = path.basename(path.dirname(filePath));
                updateTitleBar();
                toggleWelcomePage(false);
                updatePreview();
            } catch (err) { console.error(err); }
        }

        async function handleSave() {
            let savePath = state.currentFilePath;
            if (!savePath) {
                const result = await ipcRenderer.invoke('show-save-dialog');
                if (result.canceled || !result.filePath) return;
                savePath = result.filePath;
            }
            try {
                await fs.promises.writeFile(savePath, editor.getValue());
                state.isModified = false;
                state.currentFilePath = savePath;
                updateTitleBar();
            } catch (err) { console.error(err); }
        }

        async function loadDirectory(dirPath) {
            try {
                state.currentDirPath = dirPath;
                dom.currentPathDisplay.textContent = dirPath;
                const items = await fs.promises.readdir(dirPath, { withFileTypes: true });
                const sorted = items.map(i => ({ name: i.name, isDirectory: i.isDirectory(), path: path.join(dirPath, i.name) }))
                                     .sort((a,b) => a.isDirectory === b.isDirectory ? a.name.localeCompare(b.name) : a.isDirectory ? -1 : 1);
                renderFileTree(sorted);
                dom.fileExplorer.classList.add('visible');
                editor.layout();
            } catch (err) { console.error(err); }
        }

        function renderFileTree(items) {
            dom.fileTree.innerHTML = '';
            items.forEach(item => {
                dom.fileTree.appendChild(createFileTreeItem(item));
            });
        }

        function createFileTreeItem(item) {
            const el = document.createElement('div');
            el.className = item.isDirectory ? 'folder' : 'file-item';
            if (item.isDirectory) {
                el.innerHTML = `<div class="folder-header"><span class="folder-arrow">${ARROW_ICON}</span>${FOLDER_ICON}<span>${item.name}</span></div><div class="folder-content"></div>`;
                const header = el.querySelector('.folder-header');
                const content = el.querySelector('.folder-content');
                header.onclick = async (e) => {
                    e.stopPropagation();
                    el.classList.toggle('expanded');
                    if (el.classList.contains('expanded') && content.innerHTML === '') {
                        const sub = await fs.promises.readdir(item.path, { withFileTypes: true });
                        const subSorted = sub.map(s => ({ name: s.name, isDirectory: s.isDirectory(), path: path.join(item.path, s.name) }))
                                             .sort((a,b) => a.isDirectory === b.isDirectory ? a.name.localeCompare(b.name) : a.isDirectory ? -1 : 1);
                        subSorted.forEach(si => content.appendChild(createFileTreeItem(si)));
                    }
                };
            } else {
                el.innerHTML = `${FILE_ICON}<span>${item.name}</span>`;
                el.ondblclick = () => openFile(item.path);
            }
            return el;
        }

        function init() {
            amdRequire(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(dom.monacoContainer, {
                    value: '',
                    language: 'plaintext',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    fontFamily: '"Fira Code", monospace',
                    fontSize: 14,
                    lineHeight: 24,
                    minimap: { enabled: true, side: 'right' },
                    cursorBlink: 'smooth',
                    smoothScrolling: true,
                    cursorSmoothCaretAnimation: true,
                    renderLineHighlight: 'all',
                    fontLigatures: true,
                    scrollbar: {
                        vertical: 'visible',
                        horizontal: 'visible',
                        useShadows: false,
                        verticalScrollbarSize: 10,
                        horizontalScrollbarSize: 10
                    }
                });
                editor.onDidChangeModelContent(() => {
                    if (!state.isModified) { state.isModified = true; updateTitleBar(); }
                    updatePreview();
                });
            });

            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') { e.preventDefault(); handleSave(); }
                if (e.ctrlKey && e.key === 'n') { e.preventDefault(); toggleWelcomePage(false); editor.setValue(''); state.currentFilePath = null; state.isModified = false; updateTitleBar(); }
            });

            document.getElementById('show-explorer').onclick = () => { dom.fileExplorer.classList.toggle('visible'); editor.layout(); };
            document.getElementById('preview-toggle').onclick = () => {
                state.isPreviewVisible = !state.isPreviewVisible;
                dom.previewContainer.classList.toggle('visible', state.isPreviewVisible);
                editor.layout();
                updatePreview();
            };

            document.getElementById('file-menu').onclick = (e) => { e.stopPropagation(); dom.fileSubmenu.classList.toggle('show-submenu'); };
            document.getElementById('theme-menu').onclick = (e) => { e.stopPropagation(); dom.themeSubmenu.classList.toggle('show-submenu'); };
            window.onclick = () => { dom.fileSubmenu.classList.remove('show-submenu'); dom.themeSubmenu.classList.remove('show-submenu'); };

            dom.fileSubmenu.onclick = async (e) => {
                const action = e.target.closest('.submenu-item')?.dataset.action;
                if (action === 'open-folder') {
                    const r = await ipcRenderer.invoke('select-folder');
                    if (r && !r.canceled) loadDirectory(r.filePaths[0]);
                }
                if (action === 'open-file') dom.fileInput.click();
                if (action === 'save-file') handleSave();
            };

            dom.themeSubmenu.onclick = (e) => {
                const theme = e.target.closest('.submenu-item')?.dataset.theme;
                if (theme) { dom.body.className = `theme-${theme}`; monaco.editor.setTheme(theme === 'white' ? 'vs' : 'vs-dark'); }
            };

            dom.fileInput.onchange = (e) => { if (e.target.files[0]) openFile(e.target.files[0].path); };
            document.getElementById('minimize-btn').onclick = () => ipcRenderer.send('minimize-window');
            document.getElementById('maximize-btn').onclick = () => ipcRenderer.send('toggle-maximize');
            document.getElementById('close-btn').onclick = () => ipcRenderer.send('close-window');
            document.getElementById('terminal-toggle').onclick = () => ipcRenderer.send('open-standalone-terminal', state.currentDirPath);
            document.getElementById('tools-menu').onclick = () => ipcRenderer.send('open-tools-window');

            document.getElementById('new-file-explorer').onclick = () => {
                if (!state.currentDirPath) return alert('Abra uma pasta primeiro');
                const name = prompt('Nome do arquivo:');
                if (name) {
                    const filePath = path.join(state.currentDirPath, name);
                    fs.writeFileSync(filePath, '');
                    loadDirectory(state.currentDirPath);
                }
            };

            document.getElementById('new-folder-explorer').onclick = () => {
                if (!state.currentDirPath) return alert('Abra uma pasta primeiro');
                const name = prompt('Nome da pasta:');
                if (name) {
                    const dirPath = path.join(state.currentDirPath, name);
                    fs.mkdirSync(dirPath);
                    loadDirectory(state.currentDirPath);
                }
            };

            toggleWelcomePage(true);

            let isResizing = false;
            dom.resizer.onmousedown = () => isResizing = true;
            window.onmousemove = (e) => { if (isResizing) { dom.fileExplorer.style.width = e.clientX + 'px'; editor.layout(); } };
            window.onmouseup = () => isResizing = false;
        }

        init();
    </script>
</body>
</html>
