<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Arys Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f11;
            --bg-secondary: #16161a;
            --bg-tertiary: #1c1c21;
            --border-color: #2a2a32;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0ab;
            --text-muted: #666671;
            --accent-color: #a29bfe;
            --accent-glow: rgba(162, 155, 254, 0.4);
            --hover-bg: #2a2a32;
            --active-bg: #35353f;
            --bg-glass: rgba(22, 22, 26, 0.8);
            --border-glass: rgba(162, 155, 254, 0.2);
        }

        body.theme-white {
            --bg-primary: #ffffff; --bg-secondary: #f5f5f7; --bg-tertiary: #eeeeef;
            --border-color: #e0e0e5; --text-primary: #1c1c21; --text-secondary: #666671;
            --text-muted: #a0a0ab; --accent-color: #6c5ce7; --hover-bg: #e5e5ea;
            --active-bg: #dddde2; --bg-glass: rgba(255, 255, 255, 0.8);
            --border-glass: rgba(108, 92, 231, 0.2);
        }

        body.theme-red {
            --bg-primary: #1a0a0a; --bg-secondary: #250f0f; --bg-tertiary: #301414;
            --border-color: #451a1a; --text-primary: #f8d7da; --text-secondary: #a5676b;
            --text-muted: #754042; --accent-color: #ff7675; --hover-bg: #401818;
            --active-bg: #501e1e; --bg-glass: rgba(26, 10, 10, 0.8);
            --border-glass: rgba(255, 118, 117, 0.2);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-primary); color: var(--text-primary); overflow: hidden; font-family: 'Inter', sans-serif; user-select: none; }

        /* Layout */
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 35px; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag; z-index: 1000; }
        .app-layout { display: flex; height: 100vh; padding-top: 35px; }
        .side-menu { width: 50px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); z-index: 999; display: flex; flex-direction: column; align-items: center; padding-top: 15px; flex-shrink: 0; gap: 8px; }
        .main-container { display: flex; flex-grow: 1; height: 100%; position: relative; overflow: hidden; }

        /* Side Menu */
        .side-menu-item { width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text-muted); border-radius: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .side-menu-item:hover { color: var(--text-primary); background: var(--hover-bg); transform: translateY(-1px); }
        .side-menu-item.active { color: var(--accent-color); background: var(--active-bg); box-shadow: 0 0 15px var(--accent-glow); }
        .icon { width: 20px; height: 20px; stroke-width: 1.5; stroke: currentColor; fill: none; }

        /* File Explorer */
        .file-explorer { width: 260px; min-width: 180px; max-width: 500px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: none; flex-direction: column; flex-shrink: 0; position: relative; transition: width 0.1s; }
        .file-explorer.visible { display: flex; }
        .explorer-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .explorer-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .file-tree { padding: 10px; overflow-y: auto; flex-grow: 1; font-size: 13px; }
        .tree-item { padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px; margin-bottom: 2px; transition: 0.2s; color: var(--text-secondary); white-space: nowrap; }
        .tree-item:hover { background: var(--hover-bg); color: var(--text-primary); }
        .folder-content { display: none; padding-left: 16px; border-left: 1px solid var(--border-color); margin-left: 18px; }
        .expanded + .folder-content { display: block; }
        .arrow { width: 14px; height: 14px; transition: transform 0.2s; color: var(--text-muted); }
        .expanded .arrow { transform: rotate(90deg); }

        /* Window controls */
        .window-info { display: flex; align-items: center; gap: 12px; margin-left: 15px; font-size: 13px; font-weight: 500; -webkit-app-region: no-drag; }
        .window-controls { display: flex; height: 100%; -webkit-app-region: no-drag; }
        .control-btn { width: 45px; height: 100%; border: none; background: transparent; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .control-btn:hover { background: var(--hover-bg); }
        #close-btn:hover { background: #ff5f56; color: white; }

        /* Editor Area */
        .editor-section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); position: relative; }
        #monaco-container { flex: 1; height: 100%; width: 100%; display: none; }

        /* Preview */
        #preview-pane { flex: 1; height: 100%; background: #ffffff; display: none; flex-direction: column; border-left: 1px solid var(--border-color); }
        #preview-pane.visible { display: flex; }
        #preview-html { flex: 1; border: none; width: 100%; height: 100%; display: none; }
        #preview-md { flex: 1; padding: 40px; overflow-y: auto; color: #1a1a1a; user-select: text; line-height: 1.6; display: none; }

        /* --- CHIC WELCOME UI --- */
        #welcome-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.6; }
        .welcome-card {
            position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-primary) 80%);
        }
        .welcome-logo { margin-bottom: 50px; }
        .welcome-title { font-family: 'Fira Code', monospace; font-size: 48px; font-weight: 500; display: flex; align-items: center; letter-spacing: -1px; }
        .cursor { width: 4px; height: 48px; background-color: var(--accent-color); margin-left: 12px; animation: blink 1s step-end infinite; box-shadow: 0 0 10px var(--accent-color); }
        @keyframes blink { 50% { opacity: 0; } }
        .welcome-sub { font-size: 16px; color: var(--text-muted); margin-top: 15px; font-weight: 400; letter-spacing: 0.5px; }

        .actions-grid {
            margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 400px;
        }
        .btn-action {
            background: var(--bg-glass); border: 1px solid var(--border-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 24px; border-radius: 16px; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-primary);
        }
        .btn-action:hover {
            transform: translateY(-8px); border-color: var(--accent-color); box-shadow: 0 15px 30px rgba(0,0,0,0.3), 0 0 20px var(--accent-glow); background: var(--active-bg);
        }
        .btn-action .icon { width: 28px; height: 28px; color: var(--accent-color); }
        .btn-action span { font-size: 14px; font-weight: 600; }

        .resizer { width: 4px; cursor: col-resize; z-index: 50; transition: 0.3s; }
        .resizer:hover { background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); }

        /* Submenus */
        .submenu-container {
            position: absolute; left: 60px; background: var(--bg-glass);
            border: 1px solid var(--border-glass); border-radius: 12px;
            padding: 6px; z-index: 2000; display: none; min-width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .submenu-container.show-submenu { display: block; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .submenu-item {
            padding: 10px 14px; cursor: pointer; display: flex; align-items: center;
            gap: 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary);
            transition: 0.2s;
        }
        .submenu-item:hover { background: var(--active-bg); color: var(--text-primary); }
        .submenu-item .icon { width: 16px; height: 16px; color: var(--accent-color); }

        /* Editor container fix */
        .editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        #monaco-container { flex: 1; height: 100%; width: 100%; display: none; }
    </style>
</head>
<body class="theme-dark">
    <div class="top-bar">
        <div class="window-info">
            <span style="font-weight: 700; color: var(--accent-color);">ARYS</span>
            <span style="opacity: 0.2;">|</span>
            <span id="header-folder">Sem pasta</span>
            <span style="opacity: 0.2;">/</span>
            <span id="header-title">Sem título</span>
            <span id="header-mod" style="color: var(--accent-color);"></span>
        </div>
        <div class="window-controls">
            <button class="control-btn" id="min-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            <button class="control-btn" id="max-btn"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg></button>
            <button class="control-btn" id="close-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
    </div>

    <div class="app-layout">
        <div class="side-menu">
            <div class="side-menu-item" id="btn-explorer" title="Explorador"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="side-menu-item" id="btn-file" title="Arquivo"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg></div>
            <div class="side-menu-item" id="btn-term" title="Terminal"><svg class="icon" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg></div>
            <div class="side-menu-item" id="btn-preview" title="Visualização"><svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <div style="flex-grow: 1;"></div>
            <div class="side-menu-item" id="btn-theme" title="Temas"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg></div>
        </div>

        <div class="submenu-container" id="sub-file" style="top:70px;">
             <div class="submenu-item" id="act-new"><svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span class="submenu-text">Novo Arquivo</span></div>
             <div class="submenu-item" id="act-open-file"><svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg><span class="submenu-text">Abrir Arquivo</span></div>
             <div class="submenu-item" id="act-open-folder"><svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span class="submenu-text">Abrir Pasta</span></div>
             <div class="submenu-item" id="act-save"><svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg><span class="submenu-text">Salvar</span></div>
        </div>
        <div class="submenu-container" id="sub-theme" style="bottom:70px; top:auto;">
            <div class="submenu-item" data-t="dark">Escuro</div>
            <div class="submenu-item" data-t="white">Claro</div>
            <div class="submenu-item" data-t="red">Vermelho</div>
        </div>

        <div class="main-container">
            <div class="file-explorer">
                <div class="explorer-header"><span class="explorer-title">Explorador</span></div>
                <div class="file-tree"></div>
            </div>
            <div class="resizer" id="exp-resizer"></div>
            <div class="editor-section">
                <div id="welcome-ui">
                    <canvas id="particles"></canvas>
                    <div class="welcome-card">
                        <div class="welcome-logo">
                            <div class="welcome-title"><span id="type-target">Arys</span><span class="cursor"></span></div>
                            <p class="welcome-sub">Onde a precisão encontra a criatividade.</p>
                        </div>
                        <div class="actions-grid">
                            <div class="btn-action" id="welcome-new">
                                <svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg>
                                <span>Novo Arquivo</span>
                            </div>
                            <div class="btn-action" id="welcome-folder">
                                <svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                <span>Abrir Pasta</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="editor-container">
                    <div id="monaco-container"></div>
                    <div id="preview-pane">
                        <div id="preview-md"></div>
                        <iframe id="preview-html"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="f-input" style="display: none;">

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs'); const path = require('path');
        const { marked } = require('marked');

        let editor, state = { fp: null, mod: false, dp: null, pre: false };
        const ui = {
            body: document.body,
            welcome: document.getElementById('welcome-ui'),
            monaco: document.getElementById('monaco-container'),
            title: document.getElementById('header-title'),
            folder: document.getElementById('header-folder'),
            mod: document.getElementById('header-mod'),
            tree: document.querySelector('.file-tree'),
            preview: document.getElementById('preview-pane'),
            pMd: document.getElementById('preview-md'),
            pHtml: document.getElementById('preview-html'),
            fInput: document.getElementById('f-input')
        };

        function toggleWelcome(show) {
            ui.welcome.style.display = show ? 'flex' : 'none';
            ui.monaco.style.display = show ? 'none' : 'block';
            if (!show) {
                if (editor) {
                    setTimeout(() => { editor.layout(); editor.focus(); }, 50);
                } else {
                    // If editor not loaded yet, wait and try layout later
                    const check = setInterval(() => {
                        if (editor) { editor.layout(); editor.focus(); clearInterval(check); }
                    }, 100);
                }
            }
            if (show) initParticles();
        }

        function updateUI() {
            ui.title.textContent = state.fp ? path.basename(state.fp) : 'Sem título';
            ui.mod.textContent = state.mod ? '●' : '';
        }

        // --- MONACO LOADING ---
        function loadMonaco() {
            try {
                const amdLoader = require('./node_modules/monaco-editor/min/vs/loader.js');
                function uriFromPath(_path) {
                    var pathName = path.resolve(_path).replace(/\\/g, '/');
                    if (pathName.length > 0 && pathName[0] !== '/') pathName = '/' + pathName;
                    return encodeURI('file://' + pathName);
                }
                amdLoader.require.config({ baseUrl: uriFromPath(path.join(__dirname, './node_modules/monaco-editor/min')) });
                amdLoader.require(['vs/editor/editor.main'], function() {
                    editor = monaco.editor.create(ui.monaco, {
                        value: '', language: 'plaintext', theme: 'vs-dark', automaticLayout: true,
                        fontFamily: '"Fira Code", monospace', fontSize: 14, cursorBlink: 'smooth',
                        smoothScrolling: true, lineNumbersMinChars: 3, minimap: { enabled: true }
                    });
                    editor.onDidChangeModelContent(() => {
                        if (!state.mod) { state.mod = true; updateUI(); }
                        if (state.pre) updatePreview();
                    });
                });
            } catch(e) { console.error("Monaco failed to load:", e); }
        }

        // --- PREVIEW ---
        function updatePreview() {
            if (!state.pre || !editor) return;
            const val = editor.getValue();
            const ext = state.fp ? path.extname(state.fp).toLowerCase() : '';
            if (ext === '.md') {
                ui.pMd.style.display = 'block'; ui.pHtml.style.display = 'none';
                ui.pMd.innerHTML = marked.parse(val);
            } else if (ext === '.html' || ext === '.htm') {
                ui.pMd.style.display = 'none'; ui.pHtml.style.display = 'block';
                ui.pHtml.srcdoc = val;
            } else {
                ui.pMd.style.display = 'block'; ui.pHtml.style.display = 'none';
                ui.pMd.innerHTML = '<div style="color:#888; text-align:center; margin-top:100px;">Visualização não suportada.</div>';
            }
        }

        // --- ACTIONS ---
        async function actOpen(fp) {
            try {
                const data = await fs.promises.readFile(fp, 'utf-8');
                if (editor) {
                    editor.setValue(data);
                    const ext = path.extname(fp).toLowerCase().substring(1);
                    const map = { 'js': 'javascript', 'ts': 'typescript', 'py': 'python', 'md': 'markdown', 'html': 'html', 'css': 'css', 'json': 'json' };
                    monaco.editor.setModelLanguage(editor.getModel(), map[ext] || 'plaintext');
                }
                state.fp = fp; state.mod = false;
                ui.folder.textContent = path.basename(path.dirname(fp));
                updateUI(); toggleWelcome(false); updatePreview();
            } catch(e) { console.error(e); }
        }

        async function actSave() {
            let p = state.fp;
            if (!p) { const r = await ipcRenderer.invoke('show-save-dialog'); if (r.canceled || !r.filePath) return; p = r.filePath; }
            try { await fs.promises.writeFile(p, editor.getValue()); state.fp = p; state.mod = false; updateUI(); } catch(e) { console.error(e); }
        }

        async function actLoadDir(dp, target = ui.tree) {
            try {
                const entries = await fs.promises.readdir(dp, { withFileTypes: true });
                const sorted = entries.map(e => ({ name: e.name, isDir: e.isDirectory(), path: path.join(dp, e.name) }))
                                      .sort((a,b) => a.isDir === b.isDir ? a.name.localeCompare(b.name) : a.isDir ? -1 : 1);
                target.innerHTML = '';
                sorted.forEach(item => {
                    const el = document.createElement('div'); el.className = 'tree-item';
                    if (item.isDir) {
                        el.innerHTML = `<span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></span><svg class="icon" style="color:var(--accent-color);" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span>${item.name}</span>`;
                        const sub = document.createElement('div'); sub.className = 'folder-content';
                        el.onclick = (e) => { e.stopPropagation(); el.classList.toggle('expanded'); if (el.classList.contains('expanded') && sub.innerHTML === '') actLoadDir(item.path, sub); };
                        target.appendChild(el); target.appendChild(sub);
                    } else {
                        el.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg><span>${item.name}</span>`;
                        el.onclick = () => actOpen(item.path);
                        target.appendChild(el);
                    }
                });
                if (target === ui.tree) { state.dp = dp; ui.folder.textContent = path.basename(dp); document.querySelector('.file-explorer').classList.add('visible'); if (editor) editor.layout(); }
            } catch(e) { console.error(e); }
        }

        // --- VISUALS ---
        const canvas = document.getElementById('particles'); const ctx = canvas.getContext('2d');
        let parts = [];
        function initParticles() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            parts = []; const accent = getComputedStyle(ui.body).getPropertyValue('--accent-color').trim();
            for (let i=0; i<60; i++) parts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, r: Math.random()*1.5+0.5, c: i%3===0?accent:'#fff' });
        }
        function animateParts() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x<0) p.x=canvas.width; if (p.x>canvas.width) p.x=0;
                if (p.y<0) p.y=canvas.height; if (p.y>canvas.height) p.y=0;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.c; ctx.fill();
            });
            for(let i=0; i<parts.length; i++) {
                for(let j=i+1; j<parts.length; j++) {
                    const d = Math.sqrt((parts[i].x-parts[j].x)**2 + (parts[i].y-parts[j].y)**2);
                    if (d<140) { ctx.beginPath(); ctx.strokeStyle=`rgba(150,150,150,${0.1*(1-d/140)})`; ctx.moveTo(parts[i].x,parts[i].y); ctx.lineTo(parts[j].x,parts[j].y); ctx.stroke(); }
                }
            }
            requestAnimationFrame(animateParts);
        }

        const words = ["Bem-vindo ao Arys", "Elegância & Precisão", "Crie seu futuro"];
        let wI = 0, cI = 0, isE = false;
        function type() {
            const el = document.getElementById('type-target'); if (!el) return;
            const cur = words[wI];
            if (!isE) {
                el.textContent = cur.substring(0, ++cI);
                if (cI === cur.length) { isE = true; setTimeout(type, 2500); } else setTimeout(type, 90);
            } else {
                el.textContent = cur.substring(0, --cI);
                if (cI === 0) { isE = false; wI = (wI+1)%words.length; setTimeout(type, 600); } else setTimeout(type, 50);
            }
        }

        // --- APP BOOT ---
        function boot() {
            initParticles(); animateParts(); type();
            loadMonaco();

            document.getElementById('welcome-new').onclick = () => { toggleWelcome(false); if (editor) editor.setValue(''); state.fp = null; updateUI(); };
            document.getElementById('welcome-folder').onclick = async () => { const r = await ipcRenderer.invoke('select-folder'); if (r && !r.canceled) actLoadDir(r.filePaths[0]); };

            document.getElementById('btn-explorer').onclick = () => { document.querySelector('.file-explorer').classList.toggle('visible'); if (editor) editor.layout(); };
            document.getElementById('btn-file').onclick = (e) => { e.stopPropagation(); document.getElementById('sub-file').classList.toggle('show-submenu'); };
            document.getElementById('btn-theme').onclick = (e) => { e.stopPropagation(); document.getElementById('sub-theme').classList.toggle('show-submenu'); };
            window.onclick = () => document.querySelectorAll('.submenu-container').forEach(s => s.classList.remove('show-submenu'));

            document.getElementById('sub-file').onclick = async (e) => {
                const id = e.target.closest('.submenu-item')?.id;
                if (id === 'act-new') { toggleWelcome(false); if (editor) editor.setValue(''); state.fp = null; updateUI(); }
                if (id === 'act-open-file') ui.fInput.click();
                if (id === 'act-open-folder') { const r = await ipcRenderer.invoke('select-folder'); if (r && !r.canceled) actLoadDir(r.filePaths[0]); }
                if (id === 'act-save') actSave();
            };
            document.getElementById('sub-theme').onclick = (e) => {
                const t = e.target.dataset.t; if (t) { ui.body.className = `theme-${t}`; if (typeof monaco !== 'undefined') monaco.editor.setTheme(t === 'white' ? 'vs' : 'vs-dark'); initParticles(); }
            };
            document.getElementById('btn-preview').onclick = () => { state.pre = !state.pre; ui.preview.classList.toggle('visible', state.pre); if (editor) editor.layout(); updatePreview(); };
            ui.fInput.onchange = (e) => { if (e.target.files[0]) actOpen(e.target.files[0].path); };

            document.getElementById('min-btn').onclick = () => ipcRenderer.send('minimize-window');
            document.getElementById('max-btn').onclick = () => ipcRenderer.send('toggle-maximize');
            document.getElementById('close-btn').onclick = () => ipcRenderer.send('close-window');
            document.getElementById('btn-term').onclick = () => ipcRenderer.send('open-standalone-terminal', state.dp);

            window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 's') { e.preventDefault(); actSave(); } });

            let isResizing = false; document.getElementById('exp-resizer').onmousedown = () => isResizing = true;
            window.onmousemove = (e) => { if (isResizing) { document.querySelector('.file-explorer').style.width = e.clientX + 'px'; if (editor) editor.layout(); } };
            window.onmouseup = () => isResizing = false;

            toggleWelcome(true);
        }
        boot();
    </script>
</body>
</html>
